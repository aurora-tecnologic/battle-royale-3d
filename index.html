<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Battle Royale 3D - Mapa en Vivo</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #111; color: #fff; margin: 0; padding: 20px; }
        canvas { background: #1e293b; border: 2px solid #475569; display: block; margin: 15px auto; border-radius: 8px; }
        #status { font-weight: bold; }
    </style>
</head>
<body>
    <h1>🎮 Battle Royale 3D - Mapa de Jugadores</h1>
    <p>Estado del servidor: <span id="status" style="color: red;">Desconectado</span></p>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p>Toca el mapa para mover a tu personaje</p>

    <script>
        const ws = new WebSocket('ws://' + window.location.host);
        const statusEl = document.getElementById('status');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let players = {};

        ws.onopen = () => {
            statusEl.innerText = 'Conectado';
            statusEl.style.color = 'lime';
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'state') {
                players = data.players;
                draw();
            }
        };

        ws.onclose = () => {
            statusEl.innerText = 'Desconectado';
            statusEl.style.color = 'red';
        };

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ws.send(JSON.stringify({ type: 'move', x: x, y: y }));
        });

        function draw() {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Cuadrícula
            ctx.strokeStyle = '#334155';
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // Dibujar jugadores conectados
            for (let id in players) {
                const p = players[id];
                ctx.fillStyle = '#22c55e';
                ctx.beginPath();
                ctx.arc(p.x || 200, p.y || 200, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.font = '11px monospace';
                ctx.fillText(id, (p.x || 200) - 15, (p.y || 200) - 15);
            }
        }
    </script>
</body>
</html>
